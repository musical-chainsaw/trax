<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>TRAX — GPX Heatmap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #000000;
      --bg2: #0a0a0d;
      --sb: rgba(28, 28, 32, .55);
      --card: rgba(255, 255, 255, .055);
      --card2: rgba(255, 255, 255, .09);
      --glass-bd: rgba(255, 255, 255, .10);
      --glass-bd-hi: rgba(255, 255, 255, .22);
      --glass-hi: rgba(255, 255, 255, .16);
      --bd: rgba(255, 255, 255, .08);
      --bdh: rgba(255, 255, 255, .18);
      --text: rgba(255, 255, 255, .92);
      --mut: rgba(235, 235, 245, .38);
      --mut2: rgba(235, 235, 245, .62);
      --accent: #0a84ff;
      --accent2: #5e9cff;
      --warn: #ff9f0a;
      --ok: #30d158;
      --err: #ff453a;
      --sw: 340px;
      --r-lg: 26px;
      --r-md: 16px;
      --r-sm: 11px;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
      --font-mono: ui-monospace, 'SF Mono', 'IBM Plex Mono', 'Menlo', monospace;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }

    html,
    body {
      height: 100%;
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background:
        radial-gradient(ellipse 90% 60% at 15% 0%, rgba(60, 90, 160, .16), transparent 60%),
        radial-gradient(ellipse 80% 60% at 100% 100%, rgba(120, 70, 200, .12), transparent 60%),
        var(--bg);
    }

    /* Reusable liquid-glass surface: translucent, blurred, with a soft
       top specular highlight and hairline edge — the recurring "material"
       every panel in this UI is cut from. */
    .glass {
      background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .045) 40%, rgba(255, 255, 255, .035));
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-bd);
      position: relative;
    }

    .glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(160deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, .12));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: .6;
    }

    #app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      position: relative;
      padding: max(10px, var(--safe-t)) max(10px, var(--safe-r)) max(10px, var(--safe-b)) max(10px, var(--safe-l));
      gap: 10px;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sw);
      min-width: 300px;
      max-width: var(--sw);
      background: var(--sb);
      -webkit-backdrop-filter: blur(34px) saturate(190%);
      backdrop-filter: blur(34px) saturate(190%);
      border: 1px solid var(--glass-bd);
      border-radius: var(--r-lg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 200;
      transition: transform .35s cubic-bezier(.32, .72, 0, 1);
      position: relative;
    }

    #app.focus #sidebar {
      transform: translateX(calc(-1 * var(--sw) - 24px));
      position: absolute;
      top: max(10px, var(--safe-t));
      bottom: max(10px, var(--safe-b));
      left: max(10px, var(--safe-l));
    }

    #app.focus #map-wrap {
      flex: 1
    }

    #sb-head {
      padding: 18px 18px 13px;
      border-bottom: 1px solid var(--bd);
      flex-shrink: 0
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .logo-mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      flex-shrink: 0;
      background: linear-gradient(140deg, #3a82ff, #7c4dff 65%, #ff69b4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(60, 120, 255, .35), inset 0 1px 0 rgba(255, 255, 255, .35);
    }

    .logo-mark svg {
      display: block
    }

    .logo {
      font-family: var(--font-ui);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.2px;
      color: #fff;
      line-height: 1
    }

    .logo-sub {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: .1px;
      color: var(--mut);
      margin-top: 2px
    }

    .head-row {
      display: flex;
      gap: 6px;
      margin-top: 13px
    }

    .hbtn {
      flex: 1;
      padding: 9px 7px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 11px;
      color: var(--mut2);
      font-family: var(--font-ui);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: transform .15s, background .15s, color .15s, border-color .15s;
      white-space: nowrap;
    }

    .hbtn:hover {
      border-color: var(--bdh);
      color: #fff;
      background: var(--card2)
    }

    .hbtn:active {
      transform: scale(.96)
    }

    .hbtn svg {
      flex-shrink: 0
    }

    .sb-eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.1px;
      color: var(--mut);
      text-transform: uppercase;
      padding: 12px 16px 5px;
      flex-shrink: 0;
    }

    /* ── COMPARE PANEL ── */
    #cmp-panel {
      background: rgba(255, 159, 10, .08);
      border-bottom: 1px solid rgba(255, 159, 10, .22);
      padding: 12px 16px;
      flex-shrink: 0;
      display: none;
    }

    #cmp-panel.show {
      display: block
    }

    .cmp-hd {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px
    }

    .cmp-badge {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .8px;
      color: var(--warn);
      background: rgba(255, 159, 10, .16);
      border: 1px solid rgba(255, 159, 10, .3);
      border-radius: 999px;
      padding: 3px 9px
    }

    .cmp-info {
      font-size: 10.5px;
      color: var(--mut2);
      flex: 1
    }

    .cmp-exit {
      margin-left: auto;
      background: rgba(255, 159, 10, .12);
      border: 1px solid rgba(255, 159, 10, .35);
      color: var(--warn);
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .2px;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all .15s
    }

    .cmp-exit:hover {
      background: rgba(255, 159, 10, .2)
    }

    .cmp-files {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .cmp-file {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .05);
      border-radius: 10px
    }

    .cmp-sw {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }

    .cmp-fn {
      flex: 1;
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .cmp-rc {
      font-size: 9.5px;
      color: var(--mut2);
      flex-shrink: 0;
      font-family: var(--font-mono);
    }

    .cmp-rm {
      background: none;
      border: none;
      color: var(--mut);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 5px;
      border-radius: 6px;
      transition: color .15s, background .15s;
      flex-shrink: 0
    }

    .cmp-rm:hover {
      color: var(--err);
      background: rgba(255, 69, 58, .12)
    }

    .cmp-add {
      margin-top: 7px;
      width: 100%;
      padding: 8px;
      background: none;
      border: 1px dashed rgba(255, 159, 10, .32);
      border-radius: 10px;
      color: rgba(255, 178, 74, .85);
      font-family: var(--font-ui);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .1px;
      cursor: pointer;
      transition: all .15s;
      position: relative
    }

    .cmp-add input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%
    }

    .cmp-add:hover {
      background: rgba(255, 159, 10, .08);
      border-color: rgba(255, 159, 10, .55)
    }

    /* ── LOADING ── */
    #loading-bar {
      height: 2.5px;
      background: rgba(255, 255, 255, .06);
      flex-shrink: 0;
      overflow: hidden;
      display: none;
      margin: 0 16px;
      border-radius: 2px;
    }

    #loading-bar.show {
      display: block
    }

    #loading-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #7c4dff);
      width: 0%;
      transition: width .25s ease;
      border-radius: 2px
    }

    #loading-msg {
      font-size: 10.5px;
      color: var(--mut2);
      padding: 6px 16px 2px;
      letter-spacing: .1px;
      display: none;
      flex-shrink: 0
    }

    #loading-msg.show {
      display: block
    }

    /* ── GLOBAL DZ ── */
    #global-dz {
      margin: 12px 16px 8px;
      padding: 12px 14px;
      background: linear-gradient(135deg, rgba(10, 132, 255, .16), rgba(124, 77, 255, .10));
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: var(--r-md);
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      position: relative;
      transition: all .2s;
      flex-shrink: 0;
    }

    #global-dz:hover,
    #global-dz.over {
      border-color: rgba(255, 255, 255, .3);
      background: linear-gradient(135deg, rgba(10, 132, 255, .24), rgba(124, 77, 255, .16));
    }

    #global-dz input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%
    }

    .gdz-icon {
      font-size: 18px;
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gdz-txt .gdz-main {
      font-size: 12.5px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.1px
    }

    .gdz-txt .gdz-sub {
      font-size: 10px;
      color: var(--mut2);
      margin-top: 1px;
    }

    /* ── PENDING ── */
    #pending-box {
      margin: 0 16px 8px;
      flex-shrink: 0
    }

    .pb-hd {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .8px;
      color: var(--warn);
      padding: 4px 2px 6px
    }

    .pb-list {
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .pb-row {
      background: rgba(255, 159, 10, .07);
      border: 1px solid rgba(255, 159, 10, .2);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 7px
    }

    .pb-name {
      flex: 1;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pb-pts {
      font-size: 9.5px;
      font-family: var(--font-mono);
      color: var(--mut2);
      flex-shrink: 0
    }

    /* ── SCROLL ── */
    #sb-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 6px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    #sb-scroll::-webkit-scrollbar {
      width: 4px
    }

    #sb-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .16);
      border-radius: 3px
    }

    #empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 40px 20px;
      text-align: center
    }

    .empty-ring {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      color: var(--mut2)
    }

    #empty p {
      font-size: 12px;
      line-height: 1.7;
      color: var(--mut2);
      max-width: 220px;
    }

    /* ── SPORT CARD ── */
    .sport-card {
      overflow: visible;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: var(--r-md);
      transition: border-color .2s, opacity .25s, background .2s;
      animation: fadeUp .3s cubic-bezier(.22, 1, .36, 1) both
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.98)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .sport-card:hover {
      border-color: var(--bdh);
      background: rgba(255, 255, 255, .075);
    }

    .sc-head {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 12px
    }

    .sc-tog {
      width: 42px;
      height: 25px;
      background: rgba(120, 120, 128, .32);
      border-radius: 13px;
      border: none;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background .25s;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
    }

    .sc-tog.on {
      background: var(--c, var(--accent))
    }

    .sc-tog::after {
      content: '';
      position: absolute;
      width: 21px;
      height: 21px;
      background: #fff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform .25s cubic-bezier(.34, 1.56, .64, 1);
      box-shadow: 0 2px 5px rgba(0, 0, 0, .35), 0 0 0 .5px rgba(0, 0, 0, .04)
    }

    .sc-tog.on::after {
      transform: translateX(17px)
    }

    .sc-dot-wrap {
      position: relative;
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      cursor: pointer
    }

    .sc-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: block;
      transition: opacity .15s, transform .15s;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .18), 0 2px 6px rgba(0, 0, 0, .3);
    }

    .sc-dot-wrap input[type=color] {
      position: absolute;
      inset: -4px;
      opacity: 0;
      cursor: pointer;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      border: none;
      padding: 0
    }

    .sc-dot-wrap:hover .sc-dot {
      transform: scale(1.1)
    }

    .sc-name {
      flex: 1;
      font-family: var(--font-ui);
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: -.1px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sc-count {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--mut2);
      white-space: nowrap;
      flex-shrink: 0
    }

    .sc-del {
      background: none;
      border: none;
      color: var(--mut);
      font-size: 13px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 7px;
      line-height: 1;
      transition: color .15s, background .15s;
      flex-shrink: 0
    }

    .sc-del:hover {
      color: var(--err);
      background: rgba(255, 69, 58, .12)
    }

    .sc-body {
      padding: 0 12px 12px
    }

    .dz {
      border: 1.5px dashed rgba(255, 255, 255, .16);
      border-radius: var(--r-sm);
      padding: 11px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all .2s
    }

    .dz:hover,
    .dz.over {
      border-color: var(--c, var(--accent));
      background: rgba(255, 255, 255, .035)
    }

    .dz input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%
    }

    .dz-icon {
      font-size: 14px;
      margin-bottom: 2px;
      pointer-events: none
    }

    .dz-txt {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--mut2);
      pointer-events: none
    }

    .chip-list {
      margin-top: 7px;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .035)
    }

    .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .chip-label {
      flex: 1;
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .chip-label em {
      font-style: normal;
      color: var(--mut2);
      font-size: 10px;
      font-weight: 400;
    }

    .chip-warn {
      color: var(--warn);
      font-size: 11px;
      flex-shrink: 0;
      cursor: help;
    }

    .chip-pts {
      font-size: 9.5px;
      font-family: var(--font-mono);
      color: var(--mut);
      flex-shrink: 0
    }

    .mini-sel {
      background: rgba(255, 255, 255, .07);
      border: 1px solid var(--bd);
      color: var(--mut2);
      border-radius: 7px;
      padding: 4px 6px;
      font-family: var(--font-ui);
      font-size: 10.5px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
      transition: border-color .15s;
      max-width: 84px
    }

    .mini-sel:hover {
      border-color: var(--bdh);
      color: var(--text)
    }

    .mini-sel option {
      background: #1c1c22
    }

    .mini-del {
      background: none;
      border: none;
      color: var(--mut);
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1;
      flex-shrink: 0;
      transition: color .15s, background .15s
    }

    .mini-del:hover {
      color: var(--err);
      background: rgba(255, 69, 58, .12)
    }

    /* ── BOTTOM TOOLBAR ── */
    #tb {
      border-top: 1px solid var(--bd);
      padding: 10px 14px;
      display: flex;
      gap: 6px;
      flex-shrink: 0
    }

    .tb-btn {
      flex: 1;
      padding: 9px 6px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--bd);
      border-radius: 11px;
      color: var(--mut2);
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all .18s;
    }

    .tb-btn:hover {
      border-color: var(--bdh);
      color: #fff;
      background: rgba(255, 255, 255, .07)
    }

    .tb-btn:active {
      transform: scale(.96)
    }

    .tb-btn.active {
      border-color: rgba(10, 132, 255, .5);
      color: #fff;
      background: rgba(10, 132, 255, .22)
    }

    #add-btn {
      margin: 8px 14px 10px;
      padding: 11px;
      background: rgba(10, 132, 255, .14);
      border: 1px solid rgba(10, 132, 255, .3);
      border-radius: var(--r-sm);
      color: var(--accent2);

  <!-- GPX WEB WORKER SOURCE (not executed by browser) -->
  <script id="gpx-worker-src" type="text/js-worker">
self.onmessage = function(e) {
  var id = e.data.id, xml = e.data.xml;
  try {
    var pts = [], elevs = [];
    var nmM = xml.match(/<trk[\s\S]*?<name>([^<]+)<\/name>/);
    var tyM = xml.match(/<type>([^<]+)<\/type>/);
    var activityName = nmM ? nmM[1].trim() : null;
    var activityType = tyM ? tyM[1].trim().toLowerCase() : null;

    // parse trkpt / rtept
    var re = /<(?:trkpt|rtept)\s+([^>]+)>([\s\S]*?)<\/(?:trkpt|rtept)>/g;
    var m;
    while ((m = re.exec(xml)) !== null) {
      var atr = m[1], inn = m[2];
      var laM = atr.match(/lat="([^"]+)"/);
      var loM = atr.match(/lon="([^"]+)"/);
      if (!laM || !loM) continue;
      var la = parseFloat(laM[1]), lo = parseFloat(loM[1]);
      if (isNaN(la) || isNaN(lo)) continue;
      var em = inn.match(/<ele>([^<]+)<\/ele>/);
      pts.push([Math.round(la * 1e5) / 1e5, Math.round(lo * 1e5) / 1e5]);
      elevs.push(em ? parseFloat(em[1]) : null);
    }
    self.postMessage({ id: id, ok: true, pts: pts, elevs: elevs,
      activityName: activityName, activityType: activityType });
  } catch (err) {
    self.postMessage({ id: id, ok: false, error: err.message });
  }
};
</script>

  <script>
    'use strict';

    /* ═══════════════════════════════════════════════════════════
       WEB WORKER (non-blocking GPX parse)
    ═══════════════════════════════════════════════════════════ */
    const workerSrc = document.getElementById('gpx-worker-src').textContent;
    const worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: 'application/javascript' })));
    const workerTasks = new Map();
    worker.onmessage = ({ data }) => {
      const t = workerTasks.get(data.id);
      if (!t) return;
      workerTasks.delete(data.id);
      if (data.ok) t.resolve(data);
      else t.reject(new Error(data.error || 'Parse error'));
    };
    worker.onerror = e => console.error('Worker error:', e);

    function parseGPXAsync(xml) {
      const id = ++_uid;
      return new Promise((resolve, reject) => {
        workerTasks.set(id, { resolve, reject });
        worker.postMessage({ id, xml });
      });
    }

    /* ═══════════════════════════════════════════════════════════
       FIT / GZ SUPPORT (ported from FIT Toolkit)
       Converts .fit and .fit.gz files to GPX-XML in-memory, on the
       main thread, so the result can flow through the exact same
       parseGPXAsync() -> worker pipeline as native .gpx files.
    ═══════════════════════════════════════════════════════════ */
    const FIT_EPOCH_MS = 631065600000; // 1989-12-31T00:00:00Z
    const SEMI_TO_DEG = 180 / 2147483648;

    function parseFIT(arrayBuffer) {
      const bytes = new Uint8Array(arrayBuffer);
      const view = new DataView(arrayBuffer);
      if (bytes.length < 12) throw new Error('File too small');
      const headerSize = bytes[0];
      const magic = String.fromCharCode(bytes[8], bytes[9], bytes[10], bytes[11]);
      if (magic !== '.FIT') throw new Error('Not a valid .FIT file — missing signature');

      const dataEnd = Math.min(headerSize + view.getUint32(4, true), bytes.length);
      const localDefs = {};
      const records = [];
      let fitSport = null;
      let fitSubSport = null;
      let pos = headerSize;

      while (pos < dataEnd && pos < bytes.length) {
        const recHdr = bytes[pos++];

        if (recHdr & 0x80) {
          const def = localDefs[(recHdr >> 5) & 0x03];
          if (!def) continue;
          if (def.globalMsgNum === 20) records.push(readFITRecord(view, pos, def));
          pos += def.totalSize;
          continue;
        }

        const isDef = !!(recHdr & 0x40);
        const hasDevData = !!(recHdr & 0x20);
        const localType = recHdr & 0x0F;

        if (isDef) {
          pos++;
          const bigEndian = bytes[pos++] === 1;
          const globalMsgNum = view.getUint16(pos, !bigEndian); pos += 2;
          const nFields = bytes[pos++];
          const fields = [];
          let totalSize = 0;
          for (let i = 0; i < nFields; i++) {
            const fNum = bytes[pos++];
            const fSize = bytes[pos++];
            const bType = bytes[pos++];
            fields.push({
              fNum, fSize,
              isSigned: (bType === 0x01 || bType === 0x83 || bType === 0x85 || bType === 0x8B),
              isFloat: (bType === 0x8D || bType === 0x8E)
            });
            totalSize += fSize;
          }
          if (hasDevData) {
            const nDev = bytes[pos++];
            for (let i = 0; i < nDev; i++) { pos++; totalSize += bytes[pos++]; pos++; }
          }
          localDefs[localType] = { globalMsgNum, bigEndian, fields, totalSize };
        } else {
          const def = localDefs[localType];
          if (!def) break;

          if (def.globalMsgNum === 20) {
            records.push(readFITRecord(view, pos, def));
          } else if (def.globalMsgNum === 12) {
            let p = pos;
            for (const { fNum, fSize } of def.fields) {
              if (fSize === 1 && bytes[p] !== 0xFF) {
                if (fNum === 0) fitSport = bytes[p];
                if (fNum === 1) fitSubSport = bytes[p];
              }
              p += fSize;
            }
          }

          pos += def.totalSize;
        }
      }

      return { records, sport: fitSport, subSport: fitSubSport };
    }

    function readFITRecord(view, startPos, def) {
      const le = !def.bigEndian;
      let pos = startPos;
      const r = {};

      for (const { fNum, fSize, isSigned, isFloat } of def.fields) {
        let raw = null;
        try {
          if (fSize === 1) raw = isSigned ? view.getInt8(pos) : view.getUint8(pos);
          else if (fSize === 2) raw = isSigned ? view.getInt16(pos, le) : view.getUint16(pos, le);
          else if (fSize === 4 && isFloat) raw = view.getFloat32(pos, le);
          else if (fSize === 4) raw = isSigned ? view.getInt32(pos, le) : view.getUint32(pos, le);
          else if (fSize === 8 && isFloat) raw = view.getFloat64(pos, le);
        } catch (_) { }
        pos += fSize;
        if (raw == null) continue;

        if (!isFloat) {
          if (fSize === 1 && !isSigned && raw === 0xFF) continue;
          if (fSize === 1 && isSigned && raw === 0x7F) continue;
          if (fSize === 2 && !isSigned && raw === 0xFFFF) continue;
          if (fSize === 2 && isSigned && raw === 0x7FFF) continue;
          if (fSize === 4 && !isSigned && raw === 0xFFFFFFFF) continue;
          if (fSize === 4 && isSigned && raw === 0x7FFFFFFF) continue;
        }

        switch (fNum) {
          case 253: r.timestamp = new Date(raw * 1000 + FIT_EPOCH_MS); break;
          case 0: r.position_lat = raw * SEMI_TO_DEG; break;
          case 1: r.position_long = raw * SEMI_TO_DEG; break;
          case 2: r.altitude = raw / 5 - 500; break;
          case 78: r.altitude = raw / 5 - 500; break;
          case 3: r.heart_rate = raw; break;
          case 4: r.cadence = raw; break;
          case 7: r.power = raw; break;
          case 13: r.temperature = raw; break;
          case 6: r.speed = raw / 1000; break;
        }
      }
      return r;
    }

    function fitSportToGpxType(sport, subSport) {
      const sub = {
        46: 'gravelride', 7: 'cycling', 8: 'mountainbike',
        2: 'running', 3: 'trailrun', 1: 'running', 45: 'running',
      };
      if (subSport != null && sub[subSport]) return sub[subSport];
      const s = {
        1: 'running', 2: 'cycling', 11: 'walking',
        17: 'hiking', 5: 'swimming', 13: 'skiing',
      };
      return s[sport] || 'other';
    }

    function fitEscXml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function buildGPXFromFIT(records, trackName, sportType = '') {
      const gps = records.filter(r => r.position_lat != null && r.position_long != null);
      if (!gps.length) throw new Error('No GPS data found in this file');

      const pts = gps.map(r => {
        let inner = '';
        if (r.altitude != null) inner += `\n        <ele>${r.altitude.toFixed(2)}</ele>`;
        if (r.timestamp) inner += `\n        <time>${r.timestamp.toISOString()}</time>`;
        const ext = [];
        if (r.heart_rate != null) ext.push(`<gpxtpx:hr>${r.heart_rate}</gpxtpx:hr>`);
        if (r.cadence != null) ext.push(`<gpxtpx:cad>${r.cadence}</gpxtpx:cad>`);
        if (r.temperature != null) ext.push(`<gpxtpx:atemp>${r.temperature}</gpxtpx:atemp>`);
        if (r.power != null) ext.push(`<power>${r.power}</power>`);
        if (ext.length) inner += `\n        <extensions><gpxtpx:TrackPointExtension>${ext.join('')}</gpxtpx:TrackPointExtension></extensions>`;
        return `      <trkpt lat="${r.position_lat.toFixed(7)}" lon="${r.position_long.toFixed(7)}">${inner}\n      </trkpt>`;
      }).join('\n');

      return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="TRAX"
  xmlns="http://www.topografix.com/GPX/1/1"
  xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1"
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
  xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
  <trk>
    <name>${fitEscXml(trackName)}</name>
    ${sportType ? `<type>${fitEscXml(sportType)}</type>` : ''}
    <trkseg>
${pts}
    </trkseg>
  </trk>
</gpx>`;
    }

    async function decompressGzip(arrayBuffer) {
      if (!('DecompressionStream' in window))
        throw new Error('Browser lacks DecompressionStream. Use Chrome 80+, Firefox 113+, or Safari 16.4+.');
      const stream = new Blob([arrayBuffer]).stream().pipeThrough(new DecompressionStream('gzip'));
      return await new Response(stream).arrayBuffer();
    }

    // Turns any accepted upload (.gpx / .fit / .fit.gz) into a GPX-XML string.
    async function toGpxXml(file) {
      const lower = file.name.toLowerCase();
      if (lower.endsWith('.gpx')) return file.text();

      if (!lower.endsWith('.fit') && !lower.endsWith('.gz')) {
        throw new Error('Unsupported file type');
      }

      const buf = await file.arrayBuffer();
      const trackName = file.name.replace(/\.(fit\.gz|fit|gz)$/i, '');

      const fitBuf = lower.endsWith('.gz') ? await decompressGzip(buf) : buf;
      const { records, sport, subSport } = parseFIT(fitBuf);
      return buildGPXFromFIT(records, trackName, fitSportToGpxType(sport, subSport));
    }

    /* ═══════════════════════════════════════════════════════════
       TOAST NOTIFICATIONS
    ═══════════════════════════════════════════════════════════ */
    function toast(msg, type = 'info', dur = 3500) {
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.textContent = msg;
      document.getElementById('toast-wrap').appendChild(el);
      requestAnimationFrame(() => { el.classList.add('in'); });
      setTimeout(() => {
        el.classList.remove('in');
        setTimeout(() => el.remove(), 300);
      }, dur);
    }

    /* ═══════════════════════════════════════════════════════════
       LOADING INDICATOR
    ═══════════════════════════════════════════════════════════ */
    let _loadingN = 0;
    function loadingStart(msg = 'Processing…') {
      _loadingN++;
      document.getElementById('loading-bar').classList.add('show');
      document.getElementById('loading-msg').classList.add('show');
      document.getElementById('loading-msg').textContent = msg;
      document.getElementById('loading-fill').style.width = '30%';
    }
    function loadingProgress(pct, msg) {
      document.getElementById('loading-fill').style.width = pct + '%';
      if (msg) document.getElementById('loading-msg').textContent = msg;
    }
    function loadingDone() {
      _loadingN = Math.max(0, _loadingN - 1);
      if (_loadingN > 0) return;
      const fill = document.getElementById('loading-fill');
      fill.style.width = '100%';
      setTimeout(() => {
        document.getElementById('loading-bar').classList.remove('show');
        document.getElementById('loading-msg').classList.remove('show');
        fill.style.width = '0%';
      }, 400);
    }

    /* ═══════════════════════════════════════════════════════════
       BINARY COMPRESSION for .trax
    ═══════════════════════════════════════════════════════════ */
    function u8ToB64(bytes) {
      let s = '';
      const chunk = 8192;
      for (let i = 0; i < bytes.length; i += chunk)
        s += String.fromCharCode(...bytes.subarray(i, i + chunk));
      return btoa(s);
    }
    function b64ToU8(b64) {
      const s = atob(b64);
      const u = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
      return u;
    }
    function encodePts(pts) {
      if (!pts.length) return '';
      const buf = new Int32Array(pts.length * 2);
      let pa = 0, po = 0;
      for (let i = 0; i < pts.length; i++) {
        const a = Math.round(pts[i][0] * 1e5), o = Math.round(pts[i][1] * 1e5);
        buf[i * 2] = a - pa; buf[i * 2 + 1] = o - po; pa = a; po = o;
      }
      return u8ToB64(new Uint8Array(buf.buffer));
    }
    function decodePts(b64) {
      if (!b64) return [];
      const arr = new Int32Array(b64ToU8(b64).buffer);
      const pts = []; let a = 0, o = 0;
      for (let i = 0; i < arr.length; i += 2) {
        a += arr[i]; o += arr[i + 1];
        pts.push([a / 1e5, o / 1e5]);
      }
      return pts;
    }
    function encodeElevs(elevs) {
      if (!elevs || !elevs.length) return '';
      const buf = new Int16Array(elevs.length);
      for (let i = 0; i < elevs.length; i++)
        buf[i] = elevs[i] == null ? -32768 : Math.max(-32767, Math.min(32767, Math.round(elevs[i])));
      return u8ToB64(new Uint8Array(buf.buffer));
    }
    function decodeElevs(b64) {
      if (!b64) return null;
      const arr = new Int16Array(b64ToU8(b64).buffer);
      return Array.from(arr, v => v === -32768 ? null : v);
    }

    /* ═══════════════════════════════════════════════════════════
       INDEXEDDB
    ═══════════════════════════════════════════════════════════ */
    const IDB = (() => {
      let db = null;
      let opening = null;

      async function open() {
        if (db) return db;
        if (opening) return opening;

        opening = new Promise((res, rej) => {
          const r = indexedDB.open('trax_v5', 1);

          r.onupgradeneeded = e => {
            const d = e.target.result;

            if (!d.objectStoreNames.contains('sports')) {
              d.createObjectStore('sports', { keyPath: 'id' });
            }

            if (!d.objectStoreNames.contains('files')) {
              d.createObjectStore('files', { keyPath: 'id' });
            }
          };

          r.onsuccess = e => {
            db = e.target.result;
            res(db);
          };

          r.onerror = e => {
            console.error('IndexedDB open failed:', e.target.error);
            rej(e.target.error);
          };
        });

        return opening;
      }

      function tx(store, mode, fn) {
        if (!db) {
          return Promise.reject(new Error('IndexedDB not initialized'));
        }

        return new Promise((res, rej) => {
          try {
            const t = db.transaction(store, mode);
            const s = t.objectStore(store);
            const q = fn(s);

            if (q) {
              q.onsuccess = e => res(e.target.result);
              q.onerror = e => rej(e.target.error);
            } else {
              t.oncomplete = () => res();
              t.onerror = e => rej(e.target.error);
            }
          } catch (err) {
            rej(err);
          }
        });
      }

      return {
        open,
        put: (store, obj) => tx(store, 'readwrite', s => s.put(obj)),
        del: (store, id) => tx(store, 'readwrite', s => s.delete(id)),
        getAll: (store) => tx(store, 'readonly', s => s.getAll()),
      };
    })();

    /* ═══════════════════════════════════════════════════════════
       SPORT RULES
    ═══════════════════════════════════════════════════════════ */
    const RULES = [
      {
        key: 'run', name: 'Running', color: '#e53935',
        typeKeys: ['running', 'trail running', 'virtualrun', 'run', 'trailrun', 'race'],
        fileKw: ['run', 'running', 'jogging', 'jog', 'marathon', 'parkrun', 'trailrun', '5km', '10km', 'halfmarathon']
      },
      {
        key: 'ride', name: 'Cycling', color: '#ff8c00',
        typeKeys: ['cycling', 'ride', 'mountainbikeride', 'gravelride', 'virtualride', 'ebikeride', 'mountain bike ride', 'gravel ride', 'mtbride'],
        fileKw: ['ride', 'riding', 'cycling', 'bike', 'biking', 'mtb', 'bicycle', 'gravel', 'velo', 'radtour', 'rennrad', 'mountainbike', 'ebike']
      },
      {
        key: 'swim', name: 'Swimming', color: '#1e88e5',
        typeKeys: ['swimming', 'open water swimming', 'openwater', 'pool swim', 'swim'],
        fileKw: ['swim', 'swimming', 'pool', 'openwater', 'freiwasser', 'triathlon']
      },
      {
        key: 'hike', name: 'Hiking', color: '#43a047',
        typeKeys: ['hiking', 'walking', 'hike', 'walk', 'trailhike'],
        fileKw: ['hike', 'hiking', 'walk', 'walking', 'trekking', 'trek', 'trail', 'wandern', 'bergwandern']
      },
      {
        key: 'ski', name: 'Ski / Winter', color: '#cfd8e8',
        typeKeys: ['alpineski', 'backcountryski', 'nordicski', 'snowboard', 'snowboarding', 'alpine ski', 'backcountry ski', 'nordic ski', 'skitouring'],
        fileKw: ['ski', 'skiing', 'skitour', 'snowboard', 'alpine', 'alpin', 'backcountry', 'langlauf', 'crosscountry', 'snowshoe']
      },
      {
        key: 'paddle', name: 'Paddling', color: '#00acc1',
        typeKeys: ['kayaking', 'rowing', 'canoeing', 'standuppaddling', 'sup'],
        fileKw: ['kayak', 'paddle', 'rowing', 'canoe', 'rudern', 'sup']
      },
      {
        key: 'yoga', name: 'Gym / Yoga', color: '#e91e8c',
        typeKeys: ['yoga', 'workout', 'weighttraining', 'crossfit', 'hiit'],
        fileKw: ['yoga', 'gym', 'workout', 'fitness', 'crossfit', 'pilates', 'hiit']
      },
    ];
    const RULE_MAP = Object.fromEntries(RULES.map(r => [r.key, r]));

    const TYPE_NAMES = {
      'running': 'Running', 'trail running': 'Trail Run', 'virtualrun': 'Running',
      'cycling': 'Cycling', 'ride': 'Cycling', 'mountainbikeride': 'MTB',
      'mountain bike ride': 'MTB', 'gravelride': 'Gravel', 'gravel ride': 'Gravel',
      'virtualride': 'Cycling', 'ebikeride': 'E-Bike', 'mtbride': 'MTB',
      'swimming': 'Swimming', 'open water swimming': 'Open Water', 'pool swim': 'Pool', 'swim': 'Swimming',
      'hiking': 'Hiking', 'walking': 'Walking', 'hike': 'Hiking',
      'alpineski': 'Alpine Ski', 'backcountryski': 'Ski Touring', 'nordicski': 'Nordic Ski',
      'snowboard': 'Snowboard', 'snowboarding': 'Snowboard', 'alpine ski': 'Alpine Ski',
      'backcountry ski': 'Ski Touring', 'nordic ski': 'Nordic Ski', 'skitouring': 'Ski Touring',
      'kayaking': 'Kayaking', 'rowing': 'Rowing', 'standuppaddling': 'SUP', 'canoeing': 'Canoeing', 'sup': 'SUP',
      'yoga': 'Yoga', 'workout': 'Workout', 'weighttraining': 'Strength', 'crossfit': 'CrossFit', 'hiit': 'HIIT',
      'gravelride_fit': 'Gravel', 'mountainbike': 'MTB', 'skiing': 'Ski', 'other': 'Other',
    };

    function detectKeyFromType(t) {
      if (!t) return null;
      const lo = t.toLowerCase().trim();
      for (const r of RULES) {
        if (r.typeKeys.some(k => k === lo || lo.includes(k) || k.includes(lo))) return r.key;
      }
      return null;
    }
    function detectKeyFromFile(fn) {
      const base = fn.replace(/\.(gpx|fit|gz)$/i, '').replace(/[^a-zA-Z0-9]/g, ' ').toLowerCase();
      const words = base.split(/\s+/).filter(w => w.length > 1);
      for (const r of RULES) {
        for (const kw of r.fileKw) {
          if (words.includes(kw) || words.some(w => w.startsWith(kw) && kw.length >= 4)) return r.key;
        }
      }
      return null;
    }
    function chipLabel(f) {
      const name = f.activityName || f.name.replace(/\.(gpx|fit|gz)$/i, '');
      const type = f.activityType ? (TYPE_NAMES[f.activityType] || null) : null;
      return type ? `${name} <em>(${type})</em>` : name;
    }

    /* ═══════════════════════════════════════════════════════════
       STATE
    ═══════════════════════════════════════════════════════════ */
    let sports = [];
    let pending = [];
    let _uid = Date.now();
    const uid = () => ++_uid;

    // Compare
    let compareMode = false;
    let compareFiles = [];  // raw: [{id,name,data}]
    let compareGroups = [];  // rendered: [{id,label,color,pts,layer}]
    let cpColorIdx = 0;
    const CP_COLORS = ['#ff3f3f', '#00e676', '#ffd600', '#b47dff', '#ff69b4', '#00e5ff', '#ff8c00', '#80deea'];

    // Elevation
    let elevEnabled = false;
    let elevCanvas = null;
    let elevTimer = null;

    /* ═══════════════════════════════════════════════════════════
       MAP
    ═══════════════════════════════════════════════════════════ */
    const map = L.map('map', { center: [48.5, 11.0], zoom: 5, zoomControl: false });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CARTO', subdomains: 'abcd', maxZoom: 20, crossOrigin: true,
    }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    /* ═══════════════════════════════════════════════════════════
       HEATMAP LAYERS (zoom-adaptive, ultra-low blur)
    ═══════════════════════════════════════════════════════════ */
    function heatOpts(zoom) {
      if (zoom <= 8) return { radius: 3, blur: 3 };
      if (zoom <= 16) return { radius: 2, blur: 2 };
      if (zoom <= 30) return { radius: 2, blur: 2 };
      return { radius: 2, blur: 1 };
    }
    function hex2rgb(h) {
      const n = parseInt(h.replace('#', ''), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function makeGrad(hex, opacity = 1) {
      const [r, g, b] = hex2rgb(hex);
      return {
        0.0: `rgba(${r},${g},${b},0)`,
        0.4: `rgba(${r},${g},${b},${(0.42 * opacity).toFixed(2)})`,
        0.75: `rgba(${r},${g},${b},${(0.85 * opacity).toFixed(2)})`,
        1.0: `rgba(${r},${g},${b},${opacity.toFixed(2)})`,
      };
    }

    function setCanvasOpacity(layer, val, animated = false) {
      const trySet = () => {
        const c = layer && layer._canvas;
        if (c) {
          if (animated) {
            c.style.transition = 'opacity 0.65s ease';
            c.style.opacity = '0';
            requestAnimationFrame(() => { c.style.opacity = String(val); });
          } else {
            c.style.transition = '';
            c.style.opacity = String(val);
          }
        }
      };
      setTimeout(trySet, 60);
    }

    function rebuildLayer(sport, animate = false) {
      if (sport.layer) { map.removeLayer(sport.layer); sport.layer = null; }
      const all = sport.files.flatMap(f => f.pts.map(([la, lo]) => [la, lo, 0.6]));
      if (!all.length) return;
      const opts = heatOpts(map.getZoom());
      sport.layer = L.heatLayer(all, {
        ...opts, maxZoom: 19, gradient: makeGrad(sport.color), minOpacity: 0.25,
      });
      if (sport.visible) sport.layer.addTo(map);
      if (animate) setCanvasOpacity(sport.layer, 1, true);
    }

    let zTimer = null;
    map.on('zoomend', () => {
      clearTimeout(zTimer);
      zTimer = setTimeout(() => {
        sports.forEach(s => { if (s.files.length) rebuildLayer(s); });
        rebuildAllCompare();
      }, 150);
    });

    /* ═══════════════════════════════════════════════════════════
       ELEVATION CANVAS LAYER
    ═══════════════════════════════════════════════════════════ */
    function initElevCanvas() {
      if (elevCanvas) return;
      elevCanvas = document.createElement('canvas');
      elevCanvas.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;z-index:450;opacity:0;transition:opacity .4s';
      document.getElementById('map').appendChild(elevCanvas);
      map.on('moveend zoomend resize', scheduleElevRedraw);
    }

    function scheduleElevRedraw() {
      clearTimeout(elevTimer);
      if (!elevEnabled) return;
      elevTimer = setTimeout(drawElev, 80);
    }

    function drawElev() {
      if (!elevCanvas || !elevEnabled) return;
      const mapEl = document.getElementById('map');
      elevCanvas.width = mapEl.offsetWidth;
      elevCanvas.height = mapEl.offsetHeight;
      const ctx = elevCanvas.getContext('2d');
      ctx.clearRect(0, 0, elevCanvas.width, elevCanvas.height);

      // Global elevation range
      let mn = Infinity, mx = -Infinity;
      sports.forEach(s => s.files.forEach(f => {
        if (f.elevs) f.elevs.forEach(e => { if (e != null) { if (e < mn) mn = e; if (e > mx) mx = e; } });
      }));
      const hasElevData = isFinite(mn);
      if (!hasElevData) {
        toast('No elevation data in loaded routes', 'info');
        return;
      }
      const eRange = mx - mn || 1;
      const NUM_B = 28;

      sports.forEach(sport => {
        if (!sport.visible) return;
        const [r, g, b] = hex2rgb(sport.color);
        sport.files.forEach(file => {
          if (!file.pts || !file.elevs) return;
          const n = file.pts.length;
          if (n < 2) return;
          // Bucket segments by elevation
          const buckets = Array.from({ length: NUM_B }, () => []);
          for (let i = 0; i < n - 1; i++) {
            const e = file.elevs[i] ?? mn;
            const t = Math.max(0, Math.min(1, (e - mn) / eRange));
            buckets[Math.min(Math.floor(t * NUM_B), NUM_B - 1)].push(i);
          }
          buckets.forEach((idxs, bi) => {
            if (!idxs.length) return;
            const t = bi / (NUM_B - 1);
            const bri = 1 - t * 0.78;
            ctx.strokeStyle = `rgba(${Math.round(r * bri)},${Math.round(g * bri)},${Math.round(b * bri)},0.9)`;
            ctx.lineWidth = 1.7; ctx.lineCap = 'round'; ctx.beginPath();
            idxs.forEach(i => {
              const p1 = map.latLngToContainerPoint([file.pts[i][0], file.pts[i][1]]);
              const p2 = map.latLngToContainerPoint([file.pts[i + 1][0], file.pts[i + 1][1]]);
              ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
            });
            ctx.stroke();
          });
        });
      });
    }

    function toggleElevation() {
      initElevCanvas();
      elevEnabled = !elevEnabled;
      document.getElementById('btn-elev').classList.toggle('active', elevEnabled);
      elevCanvas.style.opacity = elevEnabled ? '1' : '0';
      if (elevEnabled) {
        // hide heatmaps
        sports.forEach(s => { if (s.layer) map.removeLayer(s.layer); });
        scheduleElevRedraw();
      } else {
        // show heatmaps
        sports.forEach(s => { if (s.layer && s.visible) s.layer.addTo(map); });
      }
    }

    /* ═══════════════════════════════════════════════════════════
       PERSISTENCE
    ═══════════════════════════════════════════════════════════ */
    async function saveSport(s) {
      await IDB.put('sports', { id: s.id, name: s.name, color: s.color, visible: s.visible, ruleKey: s._ruleKey || null });
    }
    async function saveFile(f, sportId) {
      await IDB.put('files', {
        id: f.id, sportId: sportId ?? null, name: f.name,
        activityName: f.activityName || null, activityType: f.activityType || null,
        pts: encodePts(f.pts), elevs: encodeElevs(f.elevs),
      });
    }
    async function loadAll() {
      await IDB.open();
      const [dbS, dbF] = await Promise.all([IDB.getAll('sports'), IDB.getAll('files')]);
      sports = dbS.map(s => ({
        id: s.id, name: s.name, color: s.color, visible: s.visible,
        _ruleKey: s.ruleKey || null, files: [], layer: null,
      }));
      pending = [];
      for (const f of dbF) {
        const entry = {
          id: f.id, name: f.name, activityName: f.activityName || null, activityType: f.activityType || null,
          pts: (typeof f.pts === 'string') ? decodePts(f.pts) : (f.pts || []),
          elevs: (typeof f.elevs === 'string' && f.elevs) ? decodeElevs(f.elevs) : (f.elevs || null),
        };
        if (f.sportId != null) {
          const sp = sports.find(s => s.id === f.sportId);
          if (sp) sp.files.push(entry); else pending.push({ ...entry, ptCount: entry.pts.length });
        } else {
          pending.push({ ...entry, ptCount: entry.pts.length });
        }
      }
      sports.forEach(s => rebuildLayer(s));
    }

    /* ═══════════════════════════════════════════════════════════
       DUPLICATE DETECTION
       Content-based (not just filename), so the same activity
       exported twice (e.g. once as .fit, once as .gpx) still gets
       flagged. Never blocks the import — just warns, so nothing
       is silently lost.
    ═══════════════════════════════════════════════════════════ */
    function isLikelyDuplicate(activityName, pts) {
      if (!pts.length) return false;
      const start = pts[0];
      const norm = (activityName || '').trim().toLowerCase();

      const all = [
        ...sports.flatMap(s => s.files),
        ...pending,
      ];

      return all.some(f => {
        if (!f.pts || !f.pts.length) return false;
        const sameLen = Math.abs(f.pts.length - pts.length) <= 2;
        const sameName = norm && (f.activityName || '').trim().toLowerCase() === norm;
        const sameStart =
          Math.abs(f.pts[0][0] - start[0]) < 0.0005 &&
          Math.abs(f.pts[0][1] - start[1]) < 0.0005;
        return sameLen && (sameName || sameStart);
      });
    }

    /* ═══════════════════════════════════════════════════════════
       INGEST FILES (non-blocking via Worker)
       Accepts .gpx, .fit, .fit.gz — non-GPX formats are converted
       to GPX-XML first via toGpxXml(), then flow through the same
       pipeline as native GPX uploads.
    ═══════════════════════════════════════════════════════════ */
    async function ingestFiles(fileList, targetSportId) {
      const SUPPORTED = ['.gpx', '.fit', '.gz'];
      const files = [...fileList].filter(f => {
        const n = f.name.toLowerCase();
        return SUPPORTED.some(ext => n.endsWith(ext));
      });
      if (!files.length) return;

      const allNames = new Set([
        ...sports.flatMap(s => s.files.map(f => f.name)),
        ...pending.map(f => f.name),
      ]);

      const fresh = files.filter(f => !allNames.has(f.name));
      if (!fresh.length) { toast('No new files (duplicates skipped)', 'info'); return; }

      loadingStart(`Parsing ${fresh.length} file${fresh.length > 1 ? 's' : ''}…`);
      const bounds = [];
      let done = 0, errCount = 0, dupCount = 0;

      for (const file of fresh) {
        let xml;
        try {
          xml = await toGpxXml(file);
        } catch (e) {
          toast(`${file.name}: ${e.message}`, 'err');
          errCount++; done++;
          loadingProgress(Math.round(done / fresh.length * 90), `Parsing… (${done}/${fresh.length})`);
          continue;
        }

        let result;
        try {
          result = await parseGPXAsync(xml);
        } catch (e) {
          toast(`Failed to parse ${file.name}`, 'err');
          errCount++; done++;
          loadingProgress(Math.round(done / fresh.length * 90), `Parsing… (${done}/${fresh.length})`);
          continue;
        }

        const { pts, elevs, activityName, activityType } = result;
        if (!pts.length) { toast(`No track points in ${file.name}`, 'info'); done++; continue; }

        const isDup = isLikelyDuplicate(activityName, pts);
        if (isDup) {
          dupCount++;
          toast(`⚠ Possible duplicate: "${activityName || file.name}" looks like it's already loaded`, 'warn', 5000);
        }

        const entry = {
          id: uid(), name: file.name, activityName, activityType, pts,
          elevs: elevs.some(e => e != null) ? elevs : null,
          dup: isDup,
        };

        let assignedId = targetSportId;
        if (!assignedId) {
          const key = detectKeyFromType(activityType) || detectKeyFromFile(file.name);
          if (key) {
            let sp = sports.find(s => s._ruleKey === key);
            if (!sp) {
              const rule = RULE_MAP[key];
              sp = { id: uid(), name: rule.name, color: rule.color, visible: true, _ruleKey: key, files: [], layer: null };
              sports.push(sp);
              await saveSport(sp);
            }
            assignedId = sp.id;
          }
        }

        if (assignedId) {
          const sp = sports.find(s => s.id === assignedId);
          if (sp) {
            sp.files.push(entry);
            await saveFile(entry, sp.id);
            pts.forEach(([la, lo]) => bounds.push([la, lo]));
            rebuildLayer(sp, true);
            if (elevEnabled) scheduleElevRedraw();
          }
        } else {
          pending.push({ ...entry, ptCount: pts.length });
          await saveFile(entry, null);
        }

        done++;
        loadingProgress(Math.round(done / fresh.length * 90), `Parsing… (${done}/${fresh.length})`);
      }

      if (bounds.length) {
        const allPts = sports.flatMap(s => s.files.flatMap(f => f.pts));
        if (allPts.length) { try { map.fitBounds(L.latLngBounds(allPts).pad(0.08)); } catch { } }
        document.getElementById('hint').style.opacity = '0';
      }

      loadingDone();
      if (errCount) toast(`${errCount} file${errCount > 1 ? 's' : ''} failed to parse`, 'err');
      else if (done > 0) toast(`${done - errCount} route${done > 1 ? 's' : ''} loaded${dupCount ? ` (${dupCount} possibly duplicate)` : ''}`, dupCount ? 'warn' : 'ok');
      render();
    }

    /* ═══════════════════════════════════════════════════════════
       ASSIGN / DELETE
    ═══════════════════════════════════════════════════════════ */
    async function assignFile(fileId, newSportId) {
      let entry = null, fromSport = null;
      const pi = pending.findIndex(f => f.id === fileId);
      if (pi >= 0) { const p = pending.splice(pi, 1)[0]; entry = { id: p.id, name: p.name, activityName: p.activityName, activityType: p.activityType, pts: p.pts, elevs: p.elevs, dup: p.dup }; }
      if (!entry) {
        for (const s of sports) {
          const fi = s.files.findIndex(f => f.id === fileId);
          if (fi >= 0) { entry = s.files.splice(fi, 1)[0]; fromSport = s; break; }
        }
      }
      if (!entry) return;
      if (fromSport) { rebuildLayer(fromSport); if (elevEnabled) scheduleElevRedraw(); }
      if (newSportId === null) {
        pending.push({ ...entry, ptCount: entry.pts.length });
        await saveFile(entry, null);
      } else {
        const to = sports.find(s => s.id === newSportId);
        if (to) {
          to.files.push(entry);
          rebuildLayer(to, true);
          await saveFile(entry, newSportId);
          if (elevEnabled) scheduleElevRedraw();
        }
      }
      render();
    }

    async function deleteFile(fileId) {
      const pi = pending.findIndex(f => f.id === fileId);
      if (pi >= 0) pending.splice(pi, 1);
      for (const s of sports) {
        const fi = s.files.findIndex(f => f.id === fileId);
        if (fi >= 0) { s.files.splice(fi, 1); rebuildLayer(s); if (elevEnabled) scheduleElevRedraw(); break; }
      }
      await IDB.del('files', fileId);
      render();
    }

    /* ═══════════════════════════════════════════════════════════
       COMPARE MODE
       - Own routes: always visible at full opacity
       - 1 .trax file: each route inside gets its own color @ 0.5
       - 2+ .trax files: each file = one color @ 0.5
    ═══════════════════════════════════════════════════════════ */
    const ROUTE_PALETTE = ['#ff3f3f', '#00e676', '#ffd600', '#b47dff', '#ff69b4', '#00e5ff', '#ff8c00', '#80deea', '#ff6b6b', '#51cf66'];

    function buildCompareGroups() {
      compareGroups.forEach(g => { if (g.layer) map.removeLayer(g.layer); });
      compareGroups = [];

      if (compareFiles.length === 0) return;

      if (compareFiles.length === 1) {
        // Individual route mode: each route in the single file gets its own color
        const file = compareFiles[0];
        const allRoutes = (file.data.sports || []).flatMap(s => s.files || []);
        allRoutes.forEach((route, i) => {
          const color = ROUTE_PALETTE[i % ROUTE_PALETTE.length];
          const pts = (typeof route.pts === 'string') ? decodePts(route.pts) : (route.pts || []);
          const label = route.activityName || route.name || `Route ${i + 1}`;
          const g = { id: uid(), label, color, pts, layer: null };
          compareGroups.push(g);
        });
        const info = `${allRoutes.length} routes — individual colors`;
        document.getElementById('cmp-info').textContent = info;
      } else {
        // Multi-file mode: each file = one color, all routes combined
        compareFiles.forEach((cf, i) => {
          const color = CP_COLORS[i % CP_COLORS.length];
          const allPts = (cf.data.sports || []).flatMap(s => (s.files || []).flatMap(r => {
            return (typeof r.pts === 'string') ? decodePts(r.pts) : (r.pts || []);
          }));
          const routeCount = (cf.data.sports || []).reduce((a, s) => a + (s.files || []).length, 0);
          const g = { id: cf.id, label: cf.name, color, pts: allPts, routeCount, layer: null };
          compareGroups.push(g);
        });
        document.getElementById('cmp-info').textContent = `${compareFiles.length} files`;
      }

      rebuildAllCompare();
    }

    function rebuildAllCompare() {
      const opts = heatOpts(map.getZoom());
      compareGroups.forEach(g => {
        if (g.layer) map.removeLayer(g.layer);
        if (!g.pts.length) return;
        g.layer = L.heatLayer(g.pts.map(([la, lo]) => [la, lo, 0.6]), {
          ...opts, maxZoom: 19, gradient: makeGrad(g.color, 1), minOpacity: 0.25,
        });
        g.layer.addTo(map);
        // Set 50% opacity on the canvas
        setCanvasOpacity(g.layer, 0.5, false);
      });
    }

    async function importTrax(file) {
      loadingStart(`Loading ${file.name}…`);
      let data;
      try {
        data = JSON.parse(await file.text());
      } catch (e) {
        loadingDone();
        toast(`Invalid .trax file: ${file.name}`, 'err');
        return;
      }

      compareFiles.push({ id: uid(), name: file.name.replace(/\.trax$/i, ''), data });
      compareMode = true;

      const allPts = (data.sports || []).flatMap(s => (s.files || []).flatMap(f => {
        const pts = (typeof f.pts === 'string') ? decodePts(f.pts) : (f.pts || []);
        return pts;
      }));
      if (allPts.length) {
        try { map.fitBounds(L.latLngBounds(allPts).pad(0.08)); } catch { }
        document.getElementById('hint').style.opacity = '0';
      }

      buildCompareGroups();
      renderCompare();
      loadingDone();
      toast(`Loaded ${file.name}`, 'ok');
    }

    function removeCompareFile(cfId) {
      const i = compareFiles.findIndex(c => c.id === cfId);
      if (i < 0) return;
      compareFiles.splice(i, 1);
      if (!compareFiles.length) { exitCompare(); return; }
      buildCompareGroups();
      renderCompare();
    }

    function exitCompare() {
      compareGroups.forEach(g => { if (g.layer) map.removeLayer(g.layer); });
      compareGroups = []; compareFiles = []; compareMode = false; cpColorIdx = 0;
      document.getElementById('cmp-panel').classList.remove('show');
      render();
    }

    function renderCompare() {
      const panel = document.getElementById('cmp-panel');
      panel.classList.toggle('show', compareMode && compareFiles.length > 0);
      if (!compareMode) return;

      const filesDiv = document.getElementById('cmp-files');
      if (compareFiles.length === 1) {
        // Show individual route colors
        filesDiv.innerHTML = `<div style="font-size:7.5px;color:var(--mut2);margin-bottom:4px;letter-spacing:.5px">${compareFiles[0].name}</div>` +
          compareGroups.slice(0, 8).map(g => `
        <div class="cmp-file">
          <span class="cmp-sw" style="background:${g.color}"></span>
          <span class="cmp-fn">${esc(g.label)}</span>
        </div>`).join('') +
          (compareGroups.length > 8 ? `<div style="font-size:7.5px;color:var(--mut2);padding:2px 7px">+${compareGroups.length - 8} more</div>` : '') +
          `<button class="cmp-rm" data-cid="${compareFiles[0].id}" style="width:100%;margin-top:4px;font-size:7.5px;padding:3px;border-radius:4px">✕ Remove file</button>`;
        panel.querySelectorAll('.cmp-rm').forEach(btn => btn.addEventListener('click', () => removeCompareFile(+btn.dataset.cid || compareFiles[0].id)));
      } else {
        filesDiv.innerHTML = compareGroups.map(g => `
      <div class="cmp-file">
        <span class="cmp-sw" style="background:${g.color}"></span>
        <span class="cmp-fn">${esc(g.label)}</span>
        <span class="cmp-rc">${g.routeCount || ''}</span>
        <button class="cmp-rm" data-cid="${g.id}">✕</button>
      </div>`).join('');
        panel.querySelectorAll('.cmp-rm').forEach(btn => btn.addEventListener('click', () => removeCompareFile(+btn.dataset.cid)));
      }
    }

    /* ═══════════════════════════════════════════════════════════
       EXPORT .trax
    ═══════════════════════════════════════════════════════════ */
    function exportTrax() {
      const visibleSports = sports.filter(s => s.visible && s.files.length);
      if (!visibleSports.length) { toast('No visible routes to export', 'info'); return; }
      const data = {
        version: 2,
        exported: new Date().toISOString(),
        sports: visibleSports.map(s => ({
          name: s.name, color: s.color,
          files: s.files.map(f => ({
            name: f.name, activityName: f.activityName, activityType: f.activityType,
            pts: encodePts(f.pts),
            elevs: encodeElevs(f.elevs),
          }))
        }))
      };
      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'myroutes.trax' });
      a.click(); URL.revokeObjectURL(a.href);
      toast('Exported myroutes.trax', 'ok');
    }

    /* ═══════════════════════════════════════════════════════════
       FOCUS MODE
    ═══════════════════════════════════════════════════════════ */
    document.getElementById('btn-focus').addEventListener('click', () => {
      document.getElementById('app').classList.add('focus');
      map.invalidateSize();
    });
    document.getElementById('focus-exit').addEventListener('click', () => {
      document.getElementById('app').classList.remove('focus');
      map.invalidateSize();
    });

    /* ═══════════════════════════════════════════════════════════
       CAPTURE / SCREENSHOT
    ═══════════════════════════════════════════════════════════ */
    let capCanvas = null;

    async function doCapture() {
      const wrap = document.getElementById('cap-canvas-wrap');
      wrap.innerHTML = '<div class="cap-spinner">◎</div>';
      const bg = document.getElementById('cap-bg').value;
      const scale = parseInt(document.getElementById('cap-scale').value);
      const glow = parseInt(document.getElementById('cap-glow').value);

      await new Promise(r => setTimeout(r, 100)); // allow repaint
      try {
        const raw = await html2canvas(document.getElementById('map'), {
          useCORS: true,
          scale: scale,
          backgroundColor: bg,
          logging: false,
        });

        if (glow > 0) {
          // Apply glow/bloom post-process on a new canvas
          const out = document.createElement('canvas');
          out.width = raw.width; out.height = raw.height;
          const ctx = out.getContext('2d');
          ctx.drawImage(raw, 0, 0);
          ctx.filter = `blur(${glow * 3}px)`;
          ctx.globalCompositeOperation = 'screen';
          ctx.globalAlpha = 0.35 * glow;
          ctx.drawImage(raw, 0, 0);
          ctx.filter = 'none';
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          capCanvas = out;
        } else {
          capCanvas = raw;
        }

        wrap.innerHTML = '';
        const preview = document.createElement('canvas');
        const maxW = wrap.offsetWidth || 480;
        const ratio = capCanvas.width / capCanvas.height;
        preview.width = maxW;
        preview.height = Math.round(maxW / ratio);
        preview.style.width = '100%';
        preview.getContext('2d').drawImage(capCanvas, 0, 0, preview.width, preview.height);
        wrap.appendChild(preview);
      } catch (e) {
        wrap.innerHTML = '<div style="color:var(--err);font-size:9px;padding:16px">Capture failed. Try disabling cross-origin blockers.</div>';
        capCanvas = null;
        toast('Screenshot failed', 'err');
      }
    }

    document.getElementById('btn-capture').addEventListener('click', async () => {
      document.getElementById('cap-overlay').classList.add('show');
      await doCapture();
    });
    document.getElementById('cap-close').addEventListener('click', () => {
      document.getElementById('cap-overlay').classList.remove('show');
      capCanvas = null;
    });
    ['cap-bg', 'cap-scale', 'cap-glow'].forEach(id => {
      document.getElementById(id).addEventListener('change', doCapture);
    });
    document.getElementById('cap-dl').addEventListener('click', () => {
      if (!capCanvas) return;
      const a = Object.assign(document.createElement('a'), { href: capCanvas.toDataURL('image/png'), download: 'trax-map.png' });
      a.click();
    });

    /* ═══════════════════════════════════════════════════════════
       RENDER
    ═══════════════════════════════════════════════════════════ */
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function fmt(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n); }

    function render() { renderPending(); renderSports(); updateStats(); }

    function renderPending() {
      const box = document.getElementById('pending-box');
      if (!pending.length) { box.innerHTML = ''; return; }
      const sportOpts = sports.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
      box.innerHTML = `
    <div class="pb-hd">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      ${pending.length} UNASSIGNED
    </div>
    <div class="pb-list">
      ${pending.map(f => `
        <div class="pb-row">
          ${f.dup ? '<span class="chip-warn" title="Possible duplicate">⚠</span>' : ''}
          <span class="pb-name" title="${esc(f.name)}">${esc(f.activityName || f.name.replace(/\.(gpx|fit|gz)$/i, ''))}</span>
          <span class="pb-pts">${fmt(f.ptCount)}pts</span>
          <select class="mini-sel assign-sel" data-fid="${f.id}"><option value="">Assign…</option>${sportOpts}</select>
          <button class="mini-del file-del" data-fid="${f.id}">✕</button>
        </div>`).join('')}
    </div>`;
      box.querySelectorAll('.assign-sel').forEach(sel => {
        sel.addEventListener('change', () => { const sid = +sel.value; if (sid) assignFile(+sel.dataset.fid, sid); });
      });
      box.querySelectorAll('.file-del').forEach(btn => btn.addEventListener('click', () => deleteFile(+btn.dataset.fid)));
    }

    function renderSports() {
      const scroll = document.getElementById('sb-scroll'), empty = document.getElementById('empty');
      scroll.querySelectorAll('.sport-card').forEach(el => el.remove());
      if (!sports.length) { empty.style.display = ''; return; }
      empty.style.display = 'none';
      sports.forEach(s => scroll.appendChild(buildCard(s)));
    }

    function buildCard(sport) {
      const card = document.createElement('div');
      card.className = 'sport-card'; card.id = 'card-' + sport.id;
      const moveOpts = [`<option value="">Move to…</option>`, `<option value="__pending__">⚠ Unassigned</option>`,
        ...sports.filter(s => s.id !== sport.id).map(s => `<option value="${s.id}">${esc(s.name)}</option>`)].join('');
      const chips = sport.files.map(f => `
    <div class="chip">
      <span class="chip-dot" style="background:${sport.color}"></span>
      ${f.dup ? '<span class="chip-warn" title="Possible duplicate">⚠</span>' : ''}
      <span class="chip-label">${chipLabel(f)}</span>
      <span class="chip-pts">${fmt(f.pts.length)}</span>
      <select class="mini-sel chip-assign" data-fid="${f.id}">${moveOpts}</select>
      <button class="mini-del chip-del" data-fid="${f.id}">✕</button>
    </div>`).join('');

      card.innerHTML = `
    <div class="sc-head">
      <button class="sc-tog ${sport.visible ? 'on' : ''}" style="--c:${sport.color}"></button>
      <div class="sc-dot-wrap" title="Click to change color">
        <span class="sc-dot" style="background:${sport.color}"></span>
        <input type="color" class="sc-color-input" value="${sport.color}">
      </div>
      <span class="sc-name" title="${esc(sport.name)}">${esc(sport.name)}</span>
      <span class="sc-count">${sport.files.length} route${sport.files.length !== 1 ? 's' : ''}</span>
      <button class="sc-del" title="Delete sport">✕</button>
    </div>
    <div class="sc-body">
      <div class="dz" style="--c:${sport.color}">
        <input type="file" accept=".gpx,.fit,.gz" multiple>
        <div class="dz-icon" style="color:${sport.color}">↑</div>
        <div class="dz-txt">Drop GPX/FIT here or click to assign</div>
      </div>
      <div class="chip-list">${chips}</div>
    </div>`;

      card.querySelector('.sc-tog').addEventListener('click', async () => {
        sport.visible = !sport.visible;
        card.querySelector('.sc-tog').classList.toggle('on', sport.visible);
        if (sport.layer) { sport.visible ? sport.layer.addTo(map) : map.removeLayer(sport.layer); }
        if (elevEnabled) scheduleElevRedraw();
        await saveSport(sport);
      });

      const ci = card.querySelector('.sc-color-input');
      let ct = null;
      ci.addEventListener('input', e => {
        sport.color = e.target.value;
        card.querySelector('.sc-dot').style.background = sport.color;
        card.querySelector('.sc-tog').style.setProperty('--c', sport.color);
        card.querySelectorAll('.chip-dot').forEach(d => d.style.background = sport.color);
        card.querySelector('.dz').style.setProperty('--c', sport.color);
        card.querySelector('.dz-icon').style.color = sport.color;
        clearTimeout(ct); ct = setTimeout(async () => { rebuildLayer(sport); if (elevEnabled) scheduleElevRedraw(); await saveSport(sport); }, 350);
      });

      card.querySelector('.sc-del').addEventListener('click', async () => {
        if (sport.layer) map.removeLayer(sport.layer);
        for (const f of sport.files) { pending.push({ ...f, ptCount: f.pts.length }); await saveFile(f, null); }
        sports = sports.filter(s => s.id !== sport.id);
        await IDB.del('sports', sport.id);
        if (elevEnabled) scheduleElevRedraw();
        render();
      });

      card.querySelector('input[type=file]').addEventListener('change', e => ingestFiles(e.target.files, sport.id));
      const dz = card.querySelector('.dz');
      dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('over'));
      dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); ingestFiles(e.dataTransfer.files, sport.id); });
      card.querySelectorAll('.chip-assign').forEach(sel => {
        sel.addEventListener('change', () => { const v = sel.value; if (v === '__pending__') assignFile(+sel.dataset.fid, null); else if (v) assignFile(+sel.dataset.fid, +v); });
      });
      card.querySelectorAll('.chip-del').forEach(btn => btn.addEventListener('click', () => deleteFile(+btn.dataset.fid)));
      return card;
    }

    function updateStats() {
      const r = sports.reduce((a, s) => a + s.files.length, 0) + pending.length;
      const p = sports.reduce((a, s) => a + s.files.reduce((b, f) => b + f.pts.length, 0), 0);
      document.getElementById('sv-r').textContent = fmt(r);
      document.getElementById('sv-p').textContent = fmt(p);
      document.getElementById('sv-s').textContent = sports.length;
    }

    /* ═══════════════════════════════════════════════════════════
       MODAL — NEW SPORT
    ═══════════════════════════════════════════════════════════ */
    const PRESETS = ['#e53935', '#ff8c00', '#ffd600', '#43a047', '#1e88e5', '#7c4dff', '#ff4081', '#00acc1', '#cfd8e8', '#e91e8c'];
    let selColor = PRESETS[0];
    (function () {
      const grid = document.getElementById('color-grid');
      PRESETS.forEach((hex, i) => {
        const b = document.createElement('button');
        b.className = 'cp' + (i === 0 ? ' sel' : ''); b.style.background = hex;
        b.addEventListener('click', () => { selColor = hex; grid.querySelectorAll('.cp').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); window.resetCustom && resetCustom(); });
        grid.appendChild(b);
      });
      const wrap = document.createElement('div'); wrap.className = 'cp-custom'; wrap.title = 'Custom color'; wrap.innerHTML = '<input type="color" value="#ffffff">+';
      const attach = () => { wrap.querySelector('input').addEventListener('input', e => { selColor = e.target.value; wrap.style.background = selColor; wrap.style.borderStyle = 'solid'; wrap.style.borderColor = '#fff';[...wrap.childNodes].filter(n => n.nodeType === 3).forEach(n => n.textContent = ''); grid.querySelectorAll('.cp').forEach(x => x.classList.remove('sel')); }); };
      attach(); grid.appendChild(wrap);
      window.resetCustom = () => { wrap.style.background = wrap.style.borderStyle = wrap.style.borderColor = ''; wrap.innerHTML = '<input type="color" value="#ffffff">+'; attach(); };
    })();

    function openModal() { selColor = PRESETS[0]; document.getElementById('inp-name').value = ''; document.getElementById('inp-name').classList.remove('err'); document.getElementById('color-grid').querySelectorAll('.cp').forEach((b, i) => b.classList.toggle('sel', i === 0)); resetCustom(); document.getElementById('overlay').classList.add('show'); setTimeout(() => document.getElementById('inp-name').focus(), 80); }
    function closeModal() { document.getElementById('overlay').classList.remove('show'); }
    async function confirmModal() {
      const inp = document.getElementById('inp-name'), name = inp.value.trim();
      if (!name) { inp.classList.add('err'); inp.focus(); setTimeout(() => inp.classList.remove('err'), 900); return; }
      const sp = { id: uid(), name, color: selColor, visible: true, _ruleKey: null, files: [], layer: null };
      sports.push(sp); await saveSport(sp); closeModal(); render();
    }

    document.getElementById('add-btn').addEventListener('click', openModal);
    document.getElementById('btn-cancel').addEventListener('click', closeModal);
    document.getElementById('btn-ok').addEventListener('click', confirmModal);
    document.getElementById('inp-name').addEventListener('keydown', e => { if (e.key === 'Enter') confirmModal(); if (e.key === 'Escape') closeModal(); });
    document.getElementById('overlay').addEventListener('click', e => { if (e.target === document.getElementById('overlay')) closeModal(); });

    /* ═══════════════════════════════════════════════════════════
       EVENT WIRING
    ═══════════════════════════════════════════════════════════ */
    const gDz = document.getElementById('global-dz');
    document.getElementById('global-input').addEventListener('change', e => ingestFiles(e.target.files, null));
    gDz.addEventListener('dragover', e => { e.preventDefault(); gDz.classList.add('over'); });
    gDz.addEventListener('dragleave', () => gDz.classList.remove('over'));
    gDz.addEventListener('drop', e => { e.preventDefault(); gDz.classList.remove('over'); ingestFiles(e.dataTransfer.files, null); });

    document.getElementById('btn-export').addEventListener('click', exportTrax);
    document.getElementById('btn-elev').addEventListener('click', toggleElevation);
    document.getElementById('btn-compare').addEventListener('click', () => document.getElementById('compare-input').click());
    document.getElementById('compare-input').addEventListener('change', e => { [...e.target.files].forEach(importTrax); e.target.value = ''; });
    document.getElementById('cmp-add-input').addEventListener('change', e => { [...e.target.files].forEach(importTrax); e.target.value = ''; });
    document.getElementById('cmp-exit').addEventListener('click', exitCompare);

    /* ═══════════════════════════════════════════════════════════
       MOBILE DRAWER
       On narrow viewports the sidebar behaves like a native nav
       drawer: a glass button over the map opens it, a backdrop or
       swipe-equivalent tap closes it again.
    ═══════════════════════════════════════════════════════════ */
    function openDrawer() { document.getElementById('app').classList.add('drawer-open'); }
    function closeDrawer() { document.getElementById('app').classList.remove('drawer-open'); }
    document.getElementById('btn-drawer').addEventListener('click', openDrawer);
    document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
    // Uploading a file, or focusing the map, feels more native if the
    // drawer gets out of the way automatically afterwards.
    document.getElementById('btn-focus').addEventListener('click', closeDrawer);
    document.getElementById('global-input').addEventListener('change', closeDrawer);

    /* ═══════════════════════════════════════════════════════════
       INIT
    ═══════════════════════════════════════════════════════════ */
    (async () => {
      try {
        loadingStart('Loading saved data…');
        await loadAll();
        loadingDone();
      } catch (e) {
        loadingDone();
        toast('Could not load saved routes: ' + e.message, 'err');
        console.error(e);
      }
      renderCompare();
      render();
      if (sports.some(s => s.files.length) || pending.length)
        document.getElementById('hint').style.opacity = '0';
    })();
  </script>
</body>

</html>
